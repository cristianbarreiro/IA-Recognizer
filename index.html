<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Circuit Canvas Background</title>
    <style>
      :root {
        --bg-color: #06070b;
        --panel-bg: rgba(13, 16, 24, 0.56);
        --panel-border: rgba(138, 180, 255, 0.35);
        --text-color: #ebf0ff;
      }

      body.light {
        --bg-color: #f7f9ff;
        --panel-bg: rgba(255, 255, 255, 0.78);
        --panel-border: rgba(102, 132, 220, 0.36);
        --text-color: #1d2850;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--bg-color);
        color: var(--text-color);
        font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        transition: background-color 220ms ease, color 220ms ease;
      }

      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .controls {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
      }

      .controls label {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .switch {
        position: relative;
        width: 54px;
        height: 30px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        background: linear-gradient(120deg, #4d65ff, #8049ff);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18) inset,
          0 8px 18px rgba(79, 100, 255, 0.28);
        padding: 0;
      }

      .thumb {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        transition: transform 200ms ease;
      }

      body.light .thumb {
        transform: translateX(24px);
      }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>

    <div class="controls">
      <label for="themeToggle">Theme</label>
      <button id="themeToggle" class="switch" type="button" aria-label="Toggle dark and light theme">
        <span class="thumb"></span>
      </button>
    </div>

    <script>
      const canvas = document.getElementById('bg');
      const ctx = canvas.getContext('2d', { alpha: false });

      const state = {
        dark: true,
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        time: 0,
        traces: [],
      };

      const themes = {
        dark: {
          background: '#06070b',
          colors: [
            ['#2ee7ff', '#6c72ff'],
            ['#34d3ff', '#a65eff'],
          ],
          baseAlpha: 0.35,
          pulseAlpha: 0.92,
          glowBlur: 10,
        },
        light: {
          background: '#f7f9ff',
          colors: [
            ['#3778ff', '#7660ff'],
            ['#2aaec8', '#9057ff'],
          ],
          baseAlpha: 0.26,
          pulseAlpha: 0.7,
          glowBlur: 7,
        },
      };

      function hash(n) {
        return (Math.sin(n * 127.1) * 43758.5453123) % 1;
      }

      function positiveHash(n) {
        return (hash(n) + 1) % 1;
      }

      function traceLength(points) {
        let len = 0;
        for (let i = 1; i < points.length; i++) {
          const dx = points[i].x - points[i - 1].x;
          const dy = points[i].y - points[i - 1].y;
          len += Math.hypot(dx, dy);
        }
        return len;
      }

      // Build "circuit" paths: mostly horizontal tracks with occasional 45° bends.
      function buildTraces(width, height) {
        const traces = [];
        const margin = 180;
        const spacing = Math.max(36, Math.min(52, height / 16));
        const startY = -spacing;
        const endY = height + spacing;

        let row = 0;
        for (let y = startY; y <= endY; y += spacing) {
          const points = [{ x: -margin, y }];
          let x = -margin;
          let currentY = y;
          let segment = 0;

          while (x < width + margin) {
            const seed = row * 97 + segment * 31;
            const hLen = 90 + positiveHash(seed + 1) * 80;
            x += hLen;
            points.push({ x, y: currentY });

            if (x > width + margin) break;

            // Only some segments bend, keeping movement calm (not too flashy/busy).
            if (positiveHash(seed + 2) > 0.52) {
              const dir = positiveHash(seed + 3) > 0.5 ? 1 : -1;
              const amp = 14 + positiveHash(seed + 4) * 16;
              const diagLen = 30 + positiveHash(seed + 5) * 24;
              x += diagLen;
              currentY += dir * amp;
              points.push({ x, y: currentY });
            }

            segment++;
          }

          const totalLen = traceLength(points);
          traces.push({
            points,
            totalLen,
            // Very subtle speed to avoid eye strain.
            speed: 0.028 + positiveHash(row * 13.7) * 0.02,
            phase: positiveHash(row * 19.3),
            colorIndex: row % 2,
          });

          row++;
        }

        return traces;
      }

      function resizeCanvas() {
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * state.dpr);
        canvas.height = Math.floor(window.innerHeight * state.dpr);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        state.traces = buildTraces(window.innerWidth, window.innerHeight);
      }

      function strokePolyline(points) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
      }

      function drawFrame(dt) {
        state.time += dt;

        const theme = state.dark ? themes.dark : themes.light;
        const width = canvas.width / state.dpr;
        const height = canvas.height / state.dpr;

        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        ctx.fillStyle = theme.background;
        ctx.fillRect(0, 0, width, height);

        for (const trace of state.traces) {
          const palette = theme.colors[trace.colorIndex];

          // Base circuit trace (steady low-intensity glow).
          const baseGradient = ctx.createLinearGradient(-100, trace.points[0].y, width + 100, trace.points[0].y + 30);
          baseGradient.addColorStop(0, palette[0]);
          baseGradient.addColorStop(1, palette[1]);

          ctx.strokeStyle = baseGradient;
          ctx.lineWidth = 1.6;
          ctx.globalAlpha = theme.baseAlpha;
          ctx.shadowColor = palette[0];
          ctx.shadowBlur = theme.glowBlur;
          ctx.setLineDash([]);
          strokePolyline(trace.points);

          // Moving light pulse: a small bright segment that travels over the same path.
          // It loops smoothly with modulo (progress % 1), so there is no jump/reset.
          const progress = (state.time * trace.speed + trace.phase) % 1;
          const pulseLength = Math.max(28, Math.min(90, trace.totalLen * 0.09));

          ctx.globalAlpha = theme.pulseAlpha;
          ctx.shadowBlur = theme.glowBlur * 1.25;
          ctx.lineWidth = 2.1;
          ctx.setLineDash([pulseLength, trace.totalLen]);
          ctx.lineDashOffset = -progress * trace.totalLen;
          strokePolyline(trace.points);

          // Inner core to make the pulse crisp but still soft.
          ctx.globalAlpha = state.dark ? 0.42 : 0.28;
          ctx.shadowBlur = 0;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 0.8;
          ctx.setLineDash([pulseLength * 0.4, trace.totalLen]);
          ctx.lineDashOffset = -progress * trace.totalLen;
          strokePolyline(trace.points);
        }

        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }

      let last = performance.now();
      // requestAnimationFrame keeps animation smooth and synced to display refresh.
      function animate(now) {
        const dt = Math.min((now - last) / 1000, 0.033);
        last = now;
        drawFrame(dt);
        requestAnimationFrame(animate);
      }

      const toggle = document.getElementById('themeToggle');
      toggle.addEventListener('click', () => {
        state.dark = !state.dark;
        document.body.classList.toggle('light', !state.dark);
      });

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
